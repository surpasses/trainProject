  <rect x="35" y="35" width="10" height="8" rx="2" fill="#111827"/>
  <rect x="55" y="35" width="10" height="8" rx="2" fill="#111827"/>
  <rect x="28" y="60" width="44" height="8" rx="2" fill="url(#gradient)"/>
  <circle cx="38" cy="72" r="5" fill="url(#gradient)"/>
